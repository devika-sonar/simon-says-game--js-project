<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <h1>press any key to start
        <br>SIMON SAYS GAME</h1>
    <h2>let's start</h2>

    <div class="btn-container"></div>
    <div class="line one">
    <div class="btn yellow" type="button" id="yellow">1</div>
    <div class="btn red" type="button" id="red">2</div>
    </div>
    <div class="line-two">
    <div class="btn blue" type="button" id="blue">3</div>
    <div class="btn green" type="button" id="green">4</div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
